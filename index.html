<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Maze</title>
    <style>
        html, body{
    height:100%;
    width: 100%;
    margin: 0;
    background: gray;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow:hidden;
}
canvas{
    background:#200202;
    border:1px solid black;
    border-radius: 50%;
    -moz-border-radius:50%;
    -webkit-border-radius:50%;
    height:50px;
    width:50px
}
#perms{
            margin-bottom: 15px;
            padding: 12px 24px;
            font-size: 16px;
            background-color: #007aff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            position: absolute;
            top: 1.5em;
}
    </style>
</head>
<body>
<button id="perms">Permission</button>
<canvas id="balling" ></canvas>
<script>
const canny = document.getElementById("balling");
const btn = document.getElementById("perms");
const dim = canny.getContext("2d");
//ball properties
let ball = {
x: canny.width/2,
y: canny.height/2,
radius:15,
vx:0,
vy:0,
color: "red"
};
//tilter
let tX = 0;
let tY = 0;

function handleTilt(e){
    tX = e.gamma || 0;
    tY = e.beta || 0;
}

function sensing(){
    //ios
    if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission == 'function'){
        DeviceMotionEvent.requestPermission()
        .then(r => {
            if (r === "granted"){
                window.addEventListener("deviceorientation", handleTilt);
                btn.style.display = "none";
            }
        })
        .catch(console.error);
    } else {
        //droid
        window.addEventListener("deviceorientation", handleTilt);
        btn.style.display = "none";
    }
    console.log("sensing");
}
btn.addEventListener("click", sensing);

//it's gaming time

function dating(){
    let fricking = .05;
    ball.vx += tX * fricking;
    ball.vy += tY * fricking;
    ball.vx *= .9;
    ball.vy *= .9;
    ball.x += ball.vx;
    ball.y += ball.vy;
    let bounce = -.7;
    if (ball.x - ball.radius <0){
        ball.x = ball.radius;
        ball.vx *= bounce;
    } else if (ball.x + ball.radius > canny.width){
        ball.x = canny.width - ball.radius;
        ball.vx *= bounce;
    }
    if (ball.y - ball.radius <0){
        ball.y = ball.radius;
        ball.vy *= bounce;
    } else if (ball.y + ball.radius > canny.height){
        ball.y = canny.height - ball.radius;
        ball.vy *= bounce;
    }
}

function reset(){
    if(!dim) return;
    dim.clearRect(0,0,canny.width,canny.height);
    dim.beginPath();
    dim.arc(ball.x,ball.y,ball.radius,0,Math.PI*2);
    dim.fillStyle = ball.color;
    dim.fill();
    dim.closePath();
}
function lol(){
    dating();
    reset();
    requestAnimationFrame(lol);
}
//aaaaand ACTION
lol();
</script>
</body>
</html>
